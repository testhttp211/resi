<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Resi Converter - Fixed Layout Vertikal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #ee4d2d; margin: 0 0 8px 0; font-weight: 800; }
        p.subtitle { color: #888; font-size: 13px; margin-bottom: 25px; }
        
        .upload-box {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 100%; min-height: 120px; border: 2px dashed #ee4d2d;
            background-color: #fffdfc; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; margin-bottom: 20px;
        }
        .upload-box:hover { background-color: #ffece6; border-color: #d73211; transform: translateY(-2px); }
        .upload-text { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 5px; }
        .upload-subtext { font-size: 12px; color: #999; }
        input[type="file"] { display: none; }
        
        #preview-container { display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        canvas {
            max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 8px;
            margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-label { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; display: block; }
        .name-input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; transition: 0.2s; }
        .name-input:focus { border-color: #ee4d2d; outline: none; }
        
        .btn {
            background-color: #ee4d2d; color: white; padding: 14px; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s;
        }
        .btn:hover { background-color: #d73211; }
        #status { font-size: 13px; color: #666; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Resi Converter Shopee</h2>
    <p class="subtitle">Layout Vertikal Pas 58mm + Zoom Variasi Tajam</p>

    <label class="upload-box" for="fileInput">
        <span class="upload-text">Klik Pilih File PDF</span>
        <span class="upload-subtext">(Format Shopee)</span>
    </label>
    <input type="file" id="fileInput" accept="application/pdf">

    <div id="status"></div>

    <div id="preview-container">
        <canvas id="the-canvas"></canvas>
        
        <div class="input-group">
            <label class="input-label">Nama File (Bisa Diedit):</label>
            <input type="text" id="fileNameInput" class="name-input" value="loading...">
        </div>

        <button id="downloadBtn" class="btn">Download JPG</button>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const canvas = document.getElementById('the-canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewContainer = document.getElementById('preview-container');
    const fileNameInput = document.getElementById('fileNameInput');

    fileInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "⏳ Memproses layout vertikal...";
        previewContainer.style.display = 'none';
        
        const fileReader = new FileReader();
        fileReader.onload = async function() {
            try {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                const page = await pdf.getPage(1);
                
                const textContent = await page.getTextContent();
                const items = textContent.items;
                const fullText = items.map(i => i.str).join(" "); 

                // --- 1. DETEKSI NAMA PEMBELI ---
                let detectedName = "Pelanggan";
                let startIndex = -1;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].str.toLowerCase().includes("penerima")) {
                        startIndex = i;
                        break;
                    }
                }
                if (startIndex !== -1) {
                    for (let j = 1; j <= 5; j++) { 
                        if (startIndex + j >= items.length) break;
                        let txt = items[startIndex + j].str.trim();
                        if (txt.length < 2 || txt === ":" || txt.match(/^[0-9]+$/)) continue; 
                        if (txt.toUpperCase().includes("CRISPINDO") || txt.toUpperCase().includes("PENGIRIM")) continue; 
                        detectedName = txt.split(/[\/,\(\)\n]|Phone|Kota/)[0].trim(); 
                        break;
                    }
                }

                // --- 2. DETEKSI BERAT & PRODUK ---
                let berat = "1kg";
                let produk = "Akrilik"; 
                const beratMatch = fullText.match(/Berat[:\s\.]*(\d+\s*(gr|kg))/i);
                if (beratMatch) berat = beratMatch[1].replace(/\s/g, "");
                
                const lower = fullText.toLowerCase();
                if (lower.includes("qris")) produk = "Standing_QRIS";
                else if (lower.includes("neon")) produk = "Neon_Box";
                else if (lower.includes("nomor") && lower.includes("rumah")) produk = "Nomor_Rumah";

                fileNameInput.value = `EllUX_Legacy_${detectedName}_${berat}_${produk}`;
                status.innerText = "✅ Selesai. Siakan download.";

                // --- 3. PROSES RENDER & CROP VERTIKAL ---
                // Pakai scale 3 supaya teks variasi yang kecil tidak pecah/blur saat di-zoom
                const viewport = page.getViewport({scale: 3});
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = viewport.height;
                tempCanvas.height = viewport.width;
                const tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.translate(tempCanvas.width, 0);
                tempCtx.rotate(90 * Math.PI / 180);
                
                await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;

                // Hitung koordinat berdasarkan layout standar PDF Shopee
                const labelW = tempCanvas.width * 0.58;       // Lebar area utama label alamat (sisi kanan)
                const labelH = tempCanvas.height;              // Tinggi penuh label
                const productW = tempCanvas.width * 0.42;     // Lebar area daftar produk (sisi kiri)
                const productH = tempCanvas.height;            // Tinggi penuh daftar produk

                // Faktor perbesaran (Zoom) khusus untuk kolom variasi agar terbaca jelas
                const zoomFactor = 1.5; 
                const finalProductW = labelW;                  // Lebar kolom variasi disamakan dengan lebar label biar rapi
                const finalProductH = productH * zoomFactor * (labelW / (productW * zoomFactor)); 

                // Tentukan dimensi canvas utama (Memanjang ke bawah / Vertikal)
                canvas.width = labelW;
                canvas.height = labelH + finalProductH + 20;   // Ditambah 20px untuk jarak/margin tengah

                // Isi background putih bersih agar tidak transparan
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Bagian Atas: Gambar Label Alamat Utama
                ctx.drawImage(
                    tempCanvas, 
                    tempCanvas.width - labelW, 0, labelW, labelH, // Source (Ambil sisi kanan PDF asli)
                    0, 0, labelW, labelH                         // Destination
                );

                // Garis pembatas visual biar karyawan tahu batas kertas potong
                ctx.strokeStyle = "#ee4d2d";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, labelH + 10);
                ctx.lineTo(canvas.width, labelH + 10);
                ctx.stroke();

                // Bagian Bawah: Gambar Daftar Produk & Variasi yang sudah di-ZOOM
                ctx.drawImage(
                    tempCanvas,
                    0, 0, productW, productH,                     // Source (Ambil sisi kiri PDF asli tempat list barang)
                    0, labelH + 20, finalProductW, finalProductH  // Destination (Ditaruh di bawah label alamat & otomatis membesar)
                );
                
                previewContainer.style.display = 'block';

            } catch (err) {
                console.error(err);
                status.innerText = "❌ Gagal memproses file.";
            }
        };
        fileReader.readAsArrayBuffer(file);
    });

    downloadBtn.addEventListener('click', () => {
        let finalName = fileNameInput.value.trim();
        if (!finalName) finalName = "resi-shopee";
        if (!finalName.toLowerCase().endsWith(".jpg")) finalName += ".jpg";

        const link = document.createElement('a');
        link.download = finalName;
        link.href = canvas.toDataURL("image/jpeg", 1.0);
        link.click();
    });
</script>

</body>
</html>
